services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kbox}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgebox}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kbox}"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

  # Containerized API. Not started by a bare `docker compose up -d`
  # — start it explicitly with `docker compose --profile full up -d`.
  app:
    build: .
    profiles: ["full"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  ollama: