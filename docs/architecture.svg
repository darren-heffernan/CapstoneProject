<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

  <!-- self-hosted boundary -->
  <rect x="10" y="46" width="960" height="540" rx="14" fill="none" stroke="#aab0ba" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="490" y="30" text-anchor="middle" font-size="13" fill="#6b7280">Self-hosted environment — no external LLM APIs, no data leaves the host</text>

  <!-- ===================== INGEST LANE ===================== -->
  <rect x="24" y="60" width="932" height="150" rx="10" fill="#eef4fb"/>
  <text x="44" y="88" font-size="15" font-weight="600" fill="#1b4f82">1 · INGEST — offline (scripts/ingest.py)</text>

  <!-- A1 -->
  <rect x="40" y="108" width="132" height="60" rx="8" fill="#ffffff" stroke="#c3c9d2"/>
  <text x="106" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1f24">Raw workbook</text>
  <text x="106" y="151" text-anchor="middle" font-size="11" fill="#5b6270">.xlsx / .csv</text>

  <!-- A2 -->
  <rect x="196" y="108" width="132" height="60" rx="8" fill="#ffffff" stroke="#c3c9d2"/>
  <text x="262" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1f24">Clean &amp; normalise</text>
  <text x="262" y="151" text-anchor="middle" font-size="11" fill="#5b6270">columns, drop blanks</text>

  <!-- A3 -->
  <rect x="352" y="108" width="132" height="60" rx="8" fill="#ffffff" stroke="#c3c9d2"/>
  <text x="418" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1f24">Filter + dedup</text>
  <text x="418" y="151" text-anchor="middle" font-size="11" fill="#5b6270">non-fault cats · row_hash</text>

  <!-- A4 Embed (shared) -->
  <rect x="508" y="108" width="132" height="60" rx="8" fill="#fdf1e0" stroke="#d98a2b"/>
  <text x="574" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#8a5410">Embed</text>
  <text x="574" y="151" text-anchor="middle" font-size="11" fill="#a06a1f">embed_texts()</text>

  <!-- ingest in-lane arrows -->
  <line x1="172" y1="138" x2="196" y2="138" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="328" y1="138" x2="352" y2="138" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="484" y1="138" x2="508" y2="138" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== SERVE LANE ===================== -->
  <rect x="24" y="360" width="932" height="150" rx="10" fill="#eef7f0"/>
  <text x="44" y="388" font-size="15" font-weight="600" fill="#1f6b3b">2 · SERVE — online (app/main.py)</text>

  <!-- B1 Browser -->
  <rect x="40" y="408" width="132" height="60" rx="8" fill="#ffffff" stroke="#c3c9d2"/>
  <text x="106" y="433" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1f24">Browser form</text>
  <text x="106" y="451" text-anchor="middle" font-size="11" fill="#5b6270">static/index.html</text>

  <!-- B2 FastAPI -->
  <rect x="196" y="408" width="132" height="60" rx="8" fill="#ffffff" stroke="#c3c9d2"/>
  <text x="262" y="433" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1f24">FastAPI</text>
  <text x="262" y="451" text-anchor="middle" font-size="11" fill="#5b6270">POST /suggest</text>

  <!-- B3 Embed (shared) -->
  <rect x="508" y="408" width="132" height="60" rx="8" fill="#fdf1e0" stroke="#d98a2b"/>
  <text x="574" y="433" text-anchor="middle" font-size="14" font-weight="600" fill="#8a5410">Embed</text>
  <text x="574" y="451" text-anchor="middle" font-size="11" fill="#a06a1f">embed_text()</text>

  <!-- B4 pgvector search -->
  <rect x="664" y="408" width="132" height="60" rx="8" fill="#ffffff" stroke="#c3c9d2"/>
  <text x="730" y="433" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1f24">pgvector search</text>
  <text x="730" y="451" text-anchor="middle" font-size="11" fill="#5b6270">top-k similar</text>

  <!-- B5 Ollama -->
  <rect x="820" y="408" width="132" height="60" rx="8" fill="#eef0fb" stroke="#5b6bc0"/>
  <text x="886" y="433" text-anchor="middle" font-size="14" font-weight="600" fill="#2b357a">Ollama LLM</text>
  <text x="886" y="451" text-anchor="middle" font-size="11" fill="#4650a0">llama3.1:8b</text>

  <!-- serve in-lane arrows -->
  <line x1="172" y1="438" x2="196" y2="438" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="328" y1="438" x2="508" y2="438" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="430" text-anchor="middle" font-size="11" fill="#5b6270">embed query</text>
  <line x1="640" y1="438" x2="664" y2="438" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="796" y1="438" x2="820" y2="438" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="808" y="398" text-anchor="middle" font-size="11" fill="#5b6270">prompt</text>

  <!-- ===================== SHARED POSTGRES ===================== -->
  <rect x="664" y="248" width="132" height="70" fill="#eae6f7"/>
  <line x1="664" y1="248" x2="664" y2="318" stroke="#6b4fa8"/>
  <line x1="796" y1="248" x2="796" y2="318" stroke="#6b4fa8"/>
  <ellipse cx="730" cy="318" rx="66" ry="12" fill="#eae6f7" stroke="#6b4fa8"/>
  <ellipse cx="730" cy="248" rx="66" ry="12" fill="#dcd4f2" stroke="#6b4fa8"/>
  <text x="730" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#4a3a78">Postgres + pgvector</text>
  <text x="730" y="289" text-anchor="middle" font-size="11" fill="#5a4a88">maintenance_records</text>
  <text x="730" y="305" text-anchor="middle" font-size="11" fill="#5a4a88">HNSW · cosine</text>

  <!-- ingest Embed -> Postgres (write) -->
  <path d="M640,148 C690,150 700,190 720,236" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="702" y="196" font-size="11" fill="#5b6270">upsert rows + vectors</text>

  <!-- serve pgvector search <-> Postgres (read) -->
  <line x1="730" y1="408" x2="730" y2="332" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="742" y="372" font-size="11" fill="#5b6270">top-k search</text>

  <!-- ===================== SHARED EMBEDDING WRAPPER LINK ===================== -->
  <line x1="574" y1="168" x2="574" y2="408" stroke="#d98a2b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="524" y="266" width="100" height="36" rx="6" fill="#fdf1e0" stroke="#d98a2b"/>
  <text x="574" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#8a5410">same wrapper</text>
  <text x="574" y="296" text-anchor="middle" font-size="10" fill="#a06a1f">app/embeddings.py</text>

  <!-- ===================== RETURN PATH ===================== -->
  <path d="M886,468 L886,538 L106,538 L106,470" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="496" y="532" text-anchor="middle" font-size="11" fill="#5b6270">suggested action + supporting cases (returned to browser)</text>
</svg>
